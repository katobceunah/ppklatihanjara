<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARA - Manajemen Tugas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        button { background-color: #28a745; color: white; cursor: pointer; border: none; font-weight: bold;}
        .hidden { display: none; }
        #dashboard { max-width: 600px; }
        .progress-bar { background: #e9ecef; border-radius: 4px; overflow: hidden; margin-top: 10px; }
        .progress-fill { background: #007bff; height: 20px; width: 0%; color: white; text-align: center; font-size: 12px; line-height: 20px; transition: width 0.3s; }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div id="login-section" class="card">
        <h2>Login JARA</h2>
        <input type="email" id="email" placeholder="Email (bebas)" value="user@jara.com">
        <input type="password" id="password" placeholder="Password (bebas)" value="12345">
        <button onclick="login()">Masuk</button>
        <p id="login-msg" style="color: red; font-size: 14px;"></p>
    </div>

    <!-- HALAMAN DASHBOARD (Awalnya disembunyikan) -->
    <div id="dashboard-section" class="card hidden" id="dashboard">
        <h2>Dashboard Proyek</h2>
        <div style="border: 1px solid #ddd; padding: 15px; border-radius: 4px;">
            <h3>Proyek Website Klien</h3>
            <p>Progres Penyelesaian Tugas:</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-ui">0%</div>
            </div>
            <br>
            <button onclick="tambahTugasSelesai()">+ Simulasikan 1 Tugas Selesai</button>
        </div>
    </div>

    <script>
        // Simulasi Integrasi API (Tugas Programmer 3)[cite: 1]
        let totalTugas = 5;
        let tugasSelesai = 0;

        function login() {
            // Simulasi nge-hit API endpoint login yang dibuat Programmer 1[cite: 1]
            document.getElementById('login-msg').innerText = "Login berhasil! Memuat dashboard...";
            setTimeout(() => {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                updateProgressUI();
            }, 800);
        }

        function tambahTugasSelesai() {
            if(tugasSelesai < totalTugas) {
                tugasSelesai++;
                updateProgressUI();
            }
        }

        function updateProgressUI() {
            // Simulasi kalkulasi persen yang dibuat Programmer 2[cite: 1]
            let persentase = Math.round((tugasSelesai / totalTugas) * 100);
            let fillElement = document.getElementById('progress-ui');
            fillElement.style.width = persentase + '%';
            fillElement.innerText = persentase + '%';
        }
    </script>
</body>
</html>
